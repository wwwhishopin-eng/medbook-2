<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>آفلاین - MedBoard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #F9FAFB; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #111827; }
        .container { text-align: center; padding: 40px 24px; max-width: 400px; }
        .icon { width: 80px; height: 80px; background: linear-gradient(135deg, #2E5BFF, #1A3FDB); border-radius: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        .icon svg { width: 36px; height: 36px; }
        h1 { font-size: 24px; font-weight: 800; color: #111A6B; margin-bottom: 8px; }
        p { font-size: 14px; color: #6B7280; line-height: 1.8; margin-bottom: 24px; }
        button { background: linear-gradient(135deg, #2E5BFF, #1A3FDB); color: #fff; border: none; padding: 12px 32px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0119 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 015.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0122.56 9"/>
                <path d="M1.42 9a15.91 15.91 0 014.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 016.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>
        <h1>اتصال اینترنت برقرار نیست</h1>
        <p>لطفاً اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید.</p>
        <button onclick="window.location.reload()">تلاش مجدد</button>
    </div>
</body>
</html>
